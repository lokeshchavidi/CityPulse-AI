    <rect x="16" y="20" width="12" height="18" rx="2" fill="#2563EB"/>
    <rect x="40" y="20" width="12" height="18" rx="2" fill="#2563EB"/>
    <rect x="64" y="20" width="12" height="18" rx="2" fill="#2563EB"/>
    <rect x="88" y="20" width="12" height="18" rx="2" fill="#2563EB"/>
    <rect x="112" y="20" width="12" height="18" rx="2" fill="#2563EB"/>
