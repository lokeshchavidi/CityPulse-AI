<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Profile card -->
  <g transform="translate(300,120)">
    <rect x="0" y="0" width="400" height="320" rx="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="80" rx="16" fill="#1E3A8A" opacity="0.06"/>

    <!-- avatar -->
    <circle cx="80" cy="80" r="44" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="80" cy="66" r="16" fill="#1E3A8A"/>
    <path d="M48 106 q32 -34 64 0 z" fill="#2563EB"/>

    <!-- verification badge -->
    <g transform="translate(112,108)">
      <circle r="14" fill="#15803D"/>
      <path d="M-6 0 l4 4 l8 -9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- info lines -->
    <rect x="150" y="50" width="140" height="10" rx="5" fill="#0F172A" opacity="0.7"/>
    <rect x="150" y="70" width="100" height="8" rx="4" fill="#E2E8F0"/>

    <!-- account management rows -->
    <g transform="translate(30,150)">
      <rect x="0" y="0" width="340" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="8" fill="#2563EB"/>
      <rect x="44" y="16" width="150" height="8" rx="4" fill="#E2E8F0"/>
    </g>
    <g transform="translate(30,204)">
      <rect x="0" y="0" width="340" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="8" fill="#0F766E"/>
      <rect x="44" y="16" width="180" height="8" rx="4" fill="#E2E8F0"/>
    </g>
    <g transform="translate(30,258)">
      <rect x="0" y="0" width="340" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="8" fill="#1E3A8A"/>
      <rect x="44" y="16" width="130" height="8" rx="4" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- Digital identity chip floating -->
  <g transform="translate(760,180)">
    <rect x="0" y="0" width="130" height="84" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="14" y="14" width="30" height="22" rx="4" fill="#2563EB"/>
    <rect x="14" y="46" width="100" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="14" y="60" width="70" height="7" rx="3.5" fill="#E2E8F0"/>
  </g>
</svg>
