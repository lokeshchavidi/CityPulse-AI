<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Central government shield -->
  <g transform="translate(500,260)">
    <path d="M0 -140 L100 -100 V-10 C100 70 55 130 0 155 C-55 130 -100 70 -100 -10 V-100 Z"
          fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M-16 0 l14 14 l28 -32" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lock centered lower -->
    <g transform="translate(0,-60)" opacity="0.001"></g>
  </g>

  <!-- Digital identity card -->
  <g transform="translate(300,340)">
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#2563EB"/>
    <rect x="54" y="20" width="80" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="54" y="36" width="60" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="16" y="66" width="118" height="8" rx="4" fill="#F8FAFC"/>
    <circle cx="24" cy="70" r="3" fill="#15803D"/>
  </g>

  <!-- Biometric fingerprint -->
  <g transform="translate(690,330)">
    <rect x="0" y="0" width="110" height="110" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <g fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round">
      <path d="M55 25 a30 30 0 0 1 30 30"/>
      <path d="M55 25 a30 30 0 0 0 -30 30 v10"/>
      <path d="M55 40 a15 15 0 0 1 15 15 v10"/>
      <path d="M55 40 a15 15 0 0 0 -15 15 v6"/>
      <path d="M55 55 v20"/>
    </g>
  </g>

  <!-- Cloud security connection lines -->
  <g transform="translate(500,80)">
    <path d="M-50 20 a24 24 0 0 1 8 -46 a32 32 0 0 1 60 -6 a26 26 0 0 1 4 52 z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
  </g>
  <path d="M500 120 L500 170" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M375 380 C 420 320, 450 280, 470 240" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <path d="M690 380 C 640 320, 600 280, 560 240" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 6" fill="none"/>

  <line x1="80" y1="470" x2="920" y2="470" stroke="#E2E8F0" stroke-width="2"/>
</svg>
