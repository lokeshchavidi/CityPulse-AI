<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Support agent -->
  <g transform="translate(360,260)">
    <circle cx="0" cy="0" r="30" fill="#1E3A8A"/>
    <path d="M-42 110 q42 -60 84 0 l-8 32 h-68 z" fill="#2563EB"/>
    <!-- headset -->
    <path d="M-30 -6 a30 30 0 0 1 60 0" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-30" cy="0" r="6" fill="#0F766E"/>
    <circle cx="30" cy="0" r="6" fill="#0F766E"/>
    <path d="M30 6 q10 4 10 16" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Help desk counter -->
  <g transform="translate(280,380)">
    <rect x="0" y="0" width="220" height="60" rx="10" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="20" y="18" width="60" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="20" y="34" width="90" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- Communication channel icons -->
  <g transform="translate(600,150)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <path d="M15 22 h40 v26 h-14 l-8 10 v-10 h-18 z" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(690,150)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <path d="M17 20 h36 v30 l-18 -12 l-18 12 z" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(600,240)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <path d="M20 20 q6 -6 12 0 l6 10 q-4 6 0 10 q6 8 14 12 q4 -4 10 0 l10 6 q0 10 -10 12 q-26 2 -44 -16 q-18 -18 -16 -44 q2 -10 12 -10 z" fill="none" stroke="#15803D" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <g transform="translate(690,240)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="35" cy="30" r="14" fill="none" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M20 55 q15 -14 30 0" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Connecting dashed lines from agent to channels -->
  <path d="M430 250 C 500 220, 550 210, 600 190" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M430 270 C 500 260, 550 270, 600 275" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Chat bubble above -->
  <g transform="translate(240,180)">
    <rect x="0" y="0" width="90" height="56" rx="14" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M18 56 l0 16 l16 -16 z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="14" y="16" width="60" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="14" y="32" width="40" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <line x1="80" y1="470" x2="920" y2="470" stroke="#E2E8F0" stroke-width="2"/>
</svg>
