<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Central processing panel -->
  <g transform="translate(360,140)">
    <rect x="0" y="0" width="280" height="280" rx="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>

    <!-- Neural network nodes -->
    <g stroke="#2563EB" stroke-width="1.5">
      <line x1="50" y1="60" x2="140" y2="100"/>
      <line x1="50" y1="140" x2="140" y2="100"/>
      <line x1="50" y1="220" x2="140" y2="180"/>
      <line x1="140" y1="100" x2="230" y2="70"/>
      <line x1="140" y1="100" x2="230" y2="140"/>
      <line x1="140" y1="180" x2="230" y2="140"/>
      <line x1="140" y1="180" x2="230" y2="210"/>
      <line x1="50" y1="60" x2="140" y2="180"/>
      <line x1="50" y1="220" x2="140" y2="100"/>
    </g>
    <g fill="#1E3A8A">
      <circle cx="50" cy="60" r="7"/>
      <circle cx="50" cy="140" r="7"/>
      <circle cx="50" cy="220" r="7"/>
