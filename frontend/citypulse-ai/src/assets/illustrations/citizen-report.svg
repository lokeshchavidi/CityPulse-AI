<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Citizen figure -->
  <g transform="translate(300,260)">
    <circle cx="0" cy="0" r="26" fill="#1E3A8A"/>
    <path d="M-36 100 q36 -54 72 0 l-8 30 h-56 z" fill="#2563EB"/>
    <!-- arm holding phone -->
    <path d="M22 40 q30 6 34 46" fill="none" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Phone with camera capture -->
  <g transform="translate(360,300)">
    <rect x="0" y="0" width="90" height="150" rx="14" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="10" y="14" width="70" height="100" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- camera focus corners -->
    <path d="M18 24 v-4 h10 M72 24 v-4 h-10 M18 100 v4 h10 M72 100 v4 h-10" stroke="#2563EB" stroke-width="2" fill="none"/>
    <circle cx="45" cy="64" r="14" fill="none" stroke="#0F766E" stroke-width="2"/>
    <circle cx="45" cy="130" r="6" fill="#E2E8F0"/>
  </g>

  <!-- Location pin above scene -->
  <g transform="translate(500,180)">
    <path d="M0 0 a20 20 0 1 1 0.01 0z" fill="#2563EB"/>
    <circle cx="0" cy="-6" r="7" fill="#FFFFFF"/>
  </g>
  <path d="M420 300 C 460 260, 480 230, 500 200" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Upload arc from phone to cloud -->
  <path d="M470 340 C 560 300, 620 280, 680 240" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Government cloud receiving -->
  <g transform="translate(720,200)">
    <path d="M-60 20 a26 26 0 0 1 8 -50 a34 34 0 0 1 66 -6 a30 30 0 0 1 4 56 z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M-24 0 a14 14 0 1 1 0.01 0" fill="none" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="-10" cy="-4" r="6" fill="#1E3A8A"/>
    <path d="M-24 8 h28" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Government building receiving the issue -->
  <g transform="translate(760,340)">
    <rect x="0" y="0" width="120" height="120" rx="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M0 0 L60 -32 L120 0 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" stroke-linejoin="round"/>
    <rect x="14" y="18" width="12" height="16" rx="2" fill="#2563EB"/>
    <rect x="36" y="18" width="12" height="16" rx="2" fill="#2563EB"/>
    <rect x="58" y="18" width="12" height="16" rx="2" fill="#2563EB"/>
    <rect x="80" y="18" width="12" height="16" rx="2" fill="#2563EB"/>
    <rect x="48" y="80" width="24" height="40" rx="3" fill="#1E3A8A"/>
  </g>

  <!-- Ground -->
  <line x1="80" y1="470" x2="920" y2="470" stroke="#E2E8F0" stroke-width="2"/>
</svg>
