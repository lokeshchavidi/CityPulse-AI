<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Central bell -->
  <g transform="translate(500,220)">
    <path d="M0 -90 a50 50 0 0 1 50 50 v40 c0 20 10 30 20 40 h-140 c10 -10 20 -20 20 -40 v-40 a50 50 0 0 1 50 -50z"
          fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-20 40 a20 20 0 0 0 40 0" fill="none" stroke="#1E3A8A" stroke-width="3"/>
    <circle cx="34" cy="-70" r="14" fill="#2563EB"/>
    <circle cx="34" cy="-70" r="14" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Radiating alert waves -->
  <g fill="none" stroke="#0F766E" stroke-width="2" opacity="0.6">
    <path d="M420 100 a120 120 0 0 0 -40 90"/>
    <path d="M580 100 a120 120 0 0 1 40 90"/>
  </g>

  <!-- Mobile notification card -->
  <g transform="translate(220,300)">
    <rect x="0" y="0" width="90" height="160" rx="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="10" y="20" width="70" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="34" r="6" fill="#2563EB"/>
    <rect x="36" y="28" width="36" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="36" y="40" width="26" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="10" y="70" width="70" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="10" y="84" width="50" height="6" rx="3" fill="#E2E8F0"/>
  </g>

  <!-- Government alert card -->
  <g transform="translate(690,300)">
    <rect x="0" y="0" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <circle cx="26" cy="26" r="10" fill="#0F766E"/>
    <path d="M22 26 l3 3 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="18" width="88" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="46" y="32" width="60" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="18" y="56" width="114" height="6" rx="3" fill="#F8FAFC"/>
  </g>

  <!-- connecting dashed lines -->
  <path d="M360 260 C 300 280, 270 300, 260 320" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M640 260 C 690 280, 720 300, 740 320" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 6"/>
</svg>
