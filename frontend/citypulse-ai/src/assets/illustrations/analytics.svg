<svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
  <!-- Main bar chart panel -->
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="260" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="40" y1="260" x2="350" y2="260" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="60" y="170" width="30" height="90" rx="4" fill="#2563EB"/>
    <rect x="105" y="140" width="30" height="120" rx="4" fill="#0F766E"/>
    <rect x="150" y="190" width="30" height="70" rx="4" fill="#1E3A8A"/>
    <rect x="195" y="110" width="30" height="150" rx="4" fill="#15803D"/>
    <rect x="240" y="150" width="30" height="110" rx="4" fill="#2563EB"/>
    <rect x="285" y="200" width="30" height="60" rx="4" fill="#0F766E"/>
    <path d="M60 220 L105 190 L150 210 L195 150 L240 170 L285 200" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="2 5"/>
  </g>

  <!-- KPI donut -->
  <g transform="translate(600,150)">
    <circle r="70" fill="none" stroke="#E2E8F0" stroke-width="20"/>
    <circle r="70" fill="none" stroke="#2563EB" stroke-width="20" stroke-dasharray="220 440" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="70" fill="none" stroke="#0F766E" stroke-width="20" stroke-dasharray="100 440" stroke-dashoffset="-220" stroke-linecap="round" transform="rotate(-90)"/>
  </g>

  <!-- Line trend chart -->
  <g transform="translate(560,300)">
    <rect x="0" y="0" width="300" height="140" rx="14" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <polyline points="20,100 60,80 100,90 140,50 180,60 220,30 260,45" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0F766E">
      <circle cx="20" cy="100" r="3"/>
      <circle cx="60" cy="80" r="3"/>
      <circle cx="100" cy="90" r="3"/>
      <circle cx="140" cy="50" r="3"/>
      <circle cx="180" cy="60" r="3"/>
      <circle cx="220" cy="30" r="3"/>
      <circle cx="260" cy="45" r="3"/>
    </g>
    <line x1="15" y1="120" x2="280" y2="120" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- AI insight chip -->
  <g transform="translate(170,450)">
    <rect x="0" y="0" width="200" height="46" rx="23" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="26" cy="23" r="8" fill="#2563EB"/>
    <rect x="46" y="16" width="130" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="46" y="28" width="90" height="6" rx="3" fill="#E2E8F0"/>
  </g>
</svg>
