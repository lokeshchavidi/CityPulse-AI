spring.application.name=CityPulse-AI

server.port=${PORT:${SERVER_PORT:8080}}

# =====================================================
# Database
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citypulse_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA
# =====================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# File Upload
# =====================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# Hibernate Logging
# =====================================================
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# =====================================================
# Swagger
# =====================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tryItOutEnabled=true

# =====================================================
# Logging
# =====================================================
# Stay on the console. Render captures stdout, and a relative log file
# can fail when the container cannot create a logs directory.

# =====================================================
# CORS
# =====================================================
# Comma-separated. Include the live Vercel origin, with https and no trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =====================================
# Spring Boot Actuator
# =====================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =====================================================
# Cloudinary
# =====================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =====================================================
# Google Gemini AI
# =====================================================
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=${GENAI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=${GENAI_TEMPERATURE:0.2}

# =====================================================
# CityPulse AI
# =====================================================
citypulse.ai.enabled=${CITYPULSE_AI_ENABLED:true}
citypulse.ai.model=${CITYPULSE_AI_MODEL:gemini-2.5-flash}
citypulse.ai.temperature=${CITYPULSE_AI_TEMPERATURE:0.2}
citypulse.ai.max-output-tokens=${CITYPULSE_AI_MAX_OUTPUT_TOKENS:2048}
citypulse.ai.confidence-threshold=${CITYPULSE_AI_CONFIDENCE_THRESHOLD:70}
citypulse.ai.max-retry-attempts=${CITYPULSE_AI_MAX_RETRY_ATTEMPTS:3}